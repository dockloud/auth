name: Go CI Workflow

env:
  MODULE_NAME: "dockloud-auth"
  MODULE_VER: "v1.0"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Test
        run:
          go test -v -race -cover ./...

  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag ghcr.io/pkab00/${{ env.MODULE_NAME }}:${{ env.MODULE_VER }} \
            .

      - name: Push Docker image
        run: docker push ghcr.io/pkab00/${{ env.MODULE_NAME }}:${{ env.MODULE_VER }}

  #deploy: